name: Fused Benchmark

# Times the fused WaveNet pass (core/src/dsp/nam/FusedWaveNet.h) against the NAM core it stands in
# for, and checks its output, on each kernel's real hardware:
# - arm64, NEON kernel: Apple silicon (macOS, Apple clang), arm64 Linux (ubuntu-24.04-arm, GCC, as
#   the Linux release builds) and Windows on ARM (windows-11-arm, MSVC). arm64 builds run NAM models
#   on it by default (GUITARFX_FUSED_WAVENET_NEON, core/CMakeLists.txt). The 2026-10-19 run measured
#   1.1-2.4x the NAM core on Apple silicon, 1.5-2.4x on arm64 Linux and 2.3-6.6x on Windows on ARM.
# - x64, AVX2 kernel (or SSE, with x64_simd set to avx or sse2): Intel macOS (macos-15-intel), x64
#   Linux (ubuntu-24.04, GCC) and x64 Windows (windows-2025, MSVC), at the SIMD level the release
#   builds ship (GUITARFX_CORE_SIMD_LEVEL, core/cmake/GuitarfxSimdLevel.cmake).
# Android is not covered: GitHub hosts no Android devices. Re-run it after changing a kernel.
#
# Manual only. The runners are shared VMs, so read the speedup column: both engines run in one
# process with their rounds interleaved, so a busy host slows both alike. The absolute times say
# less, and say nothing across platforms. Each platform's table lands in the run's summary under its
# own heading, and its raw output in its own artifact.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: >-
          Platforms to time, comma-separated: macos-arm64, linux-arm64, windows-arm64, macos-x64,
          linux-x64, windows-x64, or the groups arm64, x64 and all (macos, linux and windows alone
          mean arm64)
        required: false
        default: "all"
        type: string
      runners:
        description: >-
          Runner overrides, 'platform=label' separated by ';', e.g. 'macos-arm64=macos-15-xlarge'.
          Defaults: macos-15, ubuntu-24.04-arm, windows-11-arm, macos-15-intel, ubuntu-24.04,
          windows-2025
        required: false
        default: ""
        type: string
      x64_simd:
        description: "x64 SIMD level: avx2 runs the AVX2 kernel, as the release builds; avx or sse2 run the SSE one"
        required: false
        default: avx2
        type: choice
        options:
          - avx2
          - avx
          - sse2
      blocks:
        description: "Host block sizes, comma-separated"
        required: false
        default: "32,64,128,512"
        type: string
      rounds:
        description: "Interleaved rounds per case; each engine's best round is kept"
        required: false
        default: "7"
        type: string
      seconds:
        description: "Seconds of audio per round"
        required: false
        default: "2"
        type: string
      models:
        description: "Extra .nam files to time, repo-relative, separated by ';' (the defaults always run)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: fused-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Turns the platforms and runners inputs into the benchmark job's matrix, so a run can time one
  # platform or any mix of them.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Platforms
        id: plan
        shell: bash
        env:
          PLATFORMS: ${{ inputs.platforms }}
          RUNNERS: ${{ inputs.runners }}
          X64_SIMD: ${{ inputs.x64_simd }}
        run: |
          set -euo pipefail
          all_arm64="macos-arm64 linux-arm64 windows-arm64"
          all_x64="macos-x64 linux-x64 windows-x64"

          # One platform name, lower-cased, with the old arm64-only names mapped on.
          canonical() {
            local name
            name="$(echo "$1" | tr -d ' ' | tr '[:upper:]' '[:lower:]')"
            case "$name" in
              macos | linux | windows) echo "$name-arm64" ;;
              *) echo "$name" ;;
            esac
          }

          case "$X64_SIMD" in
            avx2) x64_kernel=AVX2 ;;
            avx | sse2) x64_kernel=SSE ;;
            *)
              echo "::error::Unknown x64_simd '$X64_SIMD': use avx2, avx or sse2"
              exit 1
              ;;
          esac

          declare -A runner=(
            [macos-arm64]=macos-15
            [linux-arm64]=ubuntu-24.04-arm
            [windows-arm64]=windows-11-arm
            [macos-x64]=macos-15-intel
            [linux-x64]=ubuntu-24.04
            [windows-x64]=windows-2025
          )
          declare -A label=(
            [macos-arm64]="Apple silicon macOS"
            [linux-arm64]="arm64 Linux"
            [windows-arm64]="Windows on ARM"
            [macos-x64]="Intel macOS"
            [linux-x64]="x64 Linux"
            [windows-x64]="x64 Windows"
          )

          IFS=';' read -r -a overrides <<< "$RUNNERS"
          for pair in ${overrides[@]+"${overrides[@]}"}; do
            pair="$(echo "$pair" | tr -d ' ')"
            if [ -z "$pair" ]; then
              continue
            fi
            case "$pair" in
              *=*) ;;
              *)
                echo "::error::'$pair' is not platform=label (the runners input)"
                exit 1
                ;;
            esac
            key="$(canonical "${pair%%=*}")"
            if [ -z "${runner[$key]+set}" ]; then
              echo "::error::Unknown platform '${pair%%=*}' in the runners input"
              exit 1
            fi
            runner[$key]="${pair#*=}"
          done

          selected=()
          IFS=',' read -r -a names <<< "$PLATFORMS"
          for name in ${names[@]+"${names[@]}"}; do
            name="$(canonical "$name")"
            case "$name" in
              "") ;;
              all) selected+=($all_arm64 $all_x64) ;;
              arm64) selected+=($all_arm64) ;;
              x64) selected+=($all_x64) ;;
              *)
                if [ -z "${label[$name]+set}" ]; then
                  echo "::error::Unknown platform '$name': use macos-arm64, linux-arm64, windows-arm64, macos-x64, linux-x64, windows-x64, arm64, x64 or all"
                  exit 1
                fi
                selected+=("$name")
                ;;
            esac
          done

          entries=""
          seen=" "
          for name in ${selected[@]+"${selected[@]}"}; do
            case "$seen" in
              *" $name "*) continue ;;
            esac
            seen="$seen$name "
            label_runner="${runner[$name]}"
            # A plain label, so it needs no escaping in the JSON below.
            case "$label_runner" in
              "" | *[!A-Za-z0-9._-]*)
                echo "::error::'$label_runner' is not a runner label (the $name runner)"
                exit 1
                ;;
            esac
            arch="${name##*-}"
            kernel=NEON
            if [ "$arch" = x64 ]; then
              kernel="$x64_kernel"
            fi
            entries="$entries${entries:+,}{\"platform\":\"$name\",\"os\":\"${name%-*}\",\"arch\":\"$arch\",\"kernel\":\"$kernel\",\"label\":\"${label[$name]}\",\"runner\":\"$label_runner\"}"
          done
          if [ -z "$entries" ]; then
            echo "::error::No platforms selected: set platforms to some of arm64, x64, or the platform names"
            exit 1
          fi
          echo "matrix={\"include\":[$entries]}" | tee -a "$GITHUB_OUTPUT"

  bench:
    name: ${{ matrix.kernel }} vs NAM core (${{ matrix.label }}, ${{ matrix.runner }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    # bash everywhere, Git Bash on Windows, so every platform runs the same steps. The macOS one can
    # be bash 3.2: no mapfile, no ${x,,}, no associative arrays, and empty arrays only through
    # ${a[@]+"${a[@]}"}.
    defaults:
      run:
        shell: bash

    # TARGET_OS, not OS: Windows already defines OS.
    env:
      BUILD_DIR: core/build-fused
      OUT_DIR: fused-benchmark
      PLATFORM: ${{ matrix.platform }}
      TARGET_OS: ${{ matrix.os }}
      ARCH: ${{ matrix.arch }}
      KERNEL: ${{ matrix.kernel }}
      X64_SIMD: ${{ inputs.x64_simd }}
      PLATFORM_LABEL: ${{ matrix.label }}
      RUNNER_LABEL: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The core only needs Eigen from the submodules (it fetches the rest itself); JUCE is not built.
      - name: Eigen submodule
        run: git submodule update --init --depth 1 Dependencies/eigen

      # The release builds use CMake 3.25 or later. On Linux, take the distribution's CMake and GCC
      # when the image lacks them or its CMake is older; macOS and Windows images have both.
      - name: Toolchain
        run: |
          set -euo pipefail
          cmake_ok() {
            command -v cmake > /dev/null 2>&1 || return 1
            set -- $(cmake --version | sed -n 's/^cmake version \([0-9][0-9]*\)\.\([0-9][0-9]*\).*/\1 \2/p')
            [ "$#" -eq 2 ] || return 1
            [ "$1" -gt 3 ] || { [ "$1" -eq 3 ] && [ "$2" -ge 25 ]; }
          }
          if [ "$TARGET_OS" = linux ]; then
            need=""
            cmake_ok || need="$need cmake"
            command -v g++ > /dev/null 2>&1 || need="$need g++"
            command -v make > /dev/null 2>&1 || need="$need make"
            if [ -n "$need" ]; then
              echo "Installing:$need"
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends $need
              hash -r
            fi
          fi
          if ! cmake_ok; then
            echo "::error::CMake 3.25 or later is needed; found: $(cmake --version 2>/dev/null | sed -n 1p)"
            exit 1
          fi
          cmake --version | sed -n 1p

      # What the kernel ran on. runner.txt opens the summary; the Configure step adds the compiler.
      # Linux and Windows also keep the full CPU description in cpuinfo.txt.
      - name: Runner
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          case "$TARGET_OS" in
            macos)
              arch="$(uname -m)"
              jobs="$(sysctl -n hw.ncpu)"
              {
                echo "uname: $(uname -mrs)"
                echo "cpu: $(sysctl -n machdep.cpu.brand_string)"
                if [ "$ARCH" = arm64 ]; then
                  echo "cores: $jobs logical, $(sysctl -n hw.perflevel0.physicalcpu 2>/dev/null || echo '?') performance"
                else
                  echo "cores: $jobs logical, $(sysctl -n hw.physicalcpu) physical"
                  echo "features: $(sysctl -n machdep.cpu.features machdep.cpu.leaf7_features 2>/dev/null | tr '\n' ' ')"
                fi
                echo "memory: $(( $(sysctl -n hw.memsize) / 1073741824 )) GB"
                echo "os: $(sw_vers -productName) $(sw_vers -productVersion) ($(sw_vers -buildVersion))"
              } > "$OUT_DIR/runner.txt"
              ;;
            linux)
              arch="$(uname -m)"
              jobs="$(nproc)"
              lscpu_out="$(lscpu)"
              # lscpu indents some fields under others, and the indent depends on its version.
              lscpu_field() {
                printf '%s\n' "$lscpu_out" | sed -n "s/^[[:space:]]*$1:[[:space:]]*//p" | sed -n 1p
              }
              {
                echo "uname: $(uname -mrs)"
                echo "cpu: $(lscpu_field 'Vendor ID') $(lscpu_field 'Model name')"
                if [ "$ARCH" = arm64 ]; then
                  echo "cpu part: $(sed -n 's/^CPU part[[:space:]]*:[[:space:]]*//p' /proc/cpuinfo | sort -u | tr '\n' ' ')"
                fi
                echo "cores: $jobs online, $(lscpu_field 'Thread(s) per core') thread(s) per core"
                echo "memory: $(awk '/^MemTotal:/ { printf "%.0f", $2 / 1048576 }' /proc/meminfo) GB"
                echo "os: $(. /etc/os-release && echo "${PRETTY_NAME:-unknown}")"
                echo "features: $(lscpu_field 'Flags')"
              } > "$OUT_DIR/runner.txt"
              {
                printf '%s\n\n' "$lscpu_out"
                cat /proc/cpuinfo
              } > "$OUT_DIR/cpuinfo.txt"
              ;;
            windows)
              jobs="${NUMBER_OF_PROCESSORS:-4}"
              # The PowerShell sits at this block's left margin, where <<'PS1' needs its end marker.
              ps1="$RUNNER_TEMP/fused-runner.ps1"
              cat > "$ps1" <<'PS1'
          $ErrorActionPreference = "Stop"
          $cpus = @(Get-CimInstance Win32_Processor)
          $os = Get-CimInstance Win32_OperatingSystem
          $cs = Get-CimInstance Win32_ComputerSystem
          $cores = ($cpus | Measure-Object -Property NumberOfCores -Sum).Sum
          "arch: {0}" -f [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          "cpu: {0} ({1})" -f "$($cpus[0].Name)".Trim(), "$($cpus[0].Manufacturer)".Trim()
          "cpu id: {0}" -f $env:PROCESSOR_IDENTIFIER
          "cores: {0} logical, {1} physical, {2} MHz" -f $cs.NumberOfLogicalProcessors, $cores, $cpus[0].MaxClockSpeed
          "memory: {0} GB" -f [math]::Round($cs.TotalPhysicalMemory / 1GB)
          "os: {0} {1}" -f $os.Caption, $os.Version
          PS1
              # Every Win32_Processor property, as plain lines: Format-List colours its output in pwsh.
              dump_ps1="$RUNNER_TEMP/fused-cpuinfo.ps1"
              cat > "$dump_ps1" <<'PS1'
          Get-CimInstance Win32_Processor | ForEach-Object {
              $_.CimInstanceProperties | ForEach-Object { "{0}: {1}" -f $_.Name, $_.Value }
              ""
          }
          PS1
              ps_exe=pwsh
              command -v pwsh > /dev/null 2>&1 || ps_exe=powershell
              "$ps_exe" -NoProfile -NonInteractive -File "$ps1" | tr -d '\r' > "$OUT_DIR/runner.txt"
              arch="$(sed -n 's/^arch: //p' "$OUT_DIR/runner.txt")"
              "$ps_exe" -NoProfile -NonInteractive -File "$dump_ps1" | tr -d '\r' > "$OUT_DIR/cpuinfo.txt"
              ;;
            *)
              echo "::error::Unknown OS '$TARGET_OS'"
              exit 1
              ;;
          esac
          cmake --version | sed -n 1p >> "$OUT_DIR/runner.txt"
          cat "$OUT_DIR/runner.txt"
          echo "JOBS=$jobs" >> "$GITHUB_ENV"
          case "$ARCH:$arch" in
            arm64:arm64 | arm64:aarch64 | arm64:Arm64 | arm64:ARM64) ;;
            x64:x86_64 | x64:amd64 | x64:X64 | x64:x64) ;;
            *)
              echo "::error::$RUNNER_LABEL is not an $ARCH runner (${arch:-unknown})"
              exit 1
              ;;
          esac

      # Release, as the app ships (-O3 -ffast-math, or /Ox /fp:fast on MSVC, from
      # guitarfx_apply_release_optimizations), with the NEON kernel on for arm64 and the x64_simd
      # level for x64. No web UI bundle and no WASM host: neither touches NAM. Per platform:
      # - macOS: one architecture per job, at the app's 11.0 minimum.
      # - Linux: GCC. On arm64 also -fsigned-char, as juce/CMakeLists.txt and android/CMakeLists.txt
      #   add it: plain char is unsigned there, and the WDL headers under the NAM resampler (pulled in
      #   through PluginController.h) refuse to compile unless it is signed.
      # - Windows: the newest Visual Studio generator with -A ARM64 or -A x64, as the release builds;
      #   the core keys MSVC ARM64 settings (/arch:armv8.x, minimp3 without SIMD) off that platform name.
      - name: Configure
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            macos-arm64)
              platform_flags=(-DCMAKE_BUILD_TYPE=Release
                              -DCMAKE_OSX_ARCHITECTURES=arm64
                              -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0)
              ;;
            macos-x64)
              platform_flags=(-DCMAKE_BUILD_TYPE=Release
                              -DCMAKE_OSX_ARCHITECTURES=x86_64
                              -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0)
              ;;
            linux-arm64)
              platform_flags=(-DCMAKE_BUILD_TYPE=Release
                              -DCMAKE_C_COMPILER=gcc
                              -DCMAKE_CXX_COMPILER=g++
                              -DCMAKE_C_FLAGS=-fsigned-char
                              -DCMAKE_CXX_FLAGS=-fsigned-char)
              ;;
            linux-x64)
              platform_flags=(-DCMAKE_BUILD_TYPE=Release
                              -DCMAKE_C_COMPILER=gcc
                              -DCMAKE_CXX_COMPILER=g++)
              ;;
            windows-arm64)
              platform_flags=(-A ARM64)
              ;;
            windows-x64)
              platform_flags=(-A x64)
              ;;
            *)
              echo "::error::Unknown platform '$PLATFORM'"
              exit 1
              ;;
          esac
          if [ "$ARCH" = x64 ]; then
            platform_flags+=("-DGUITARFX_CORE_SIMD_LEVEL=$X64_SIMD")
          fi
          cmake -S core -B "$BUILD_DIR" ${platform_flags[@]+"${platform_flags[@]}"} \
            -DGUITARFX_CORE_BUILD_TESTS=ON \
            -DGUITARFX_FUSED_WAVENET_NEON=ON \
            -DGUITARFX_CORE_BUILD_WEB_UI=OFF \
            -DGUITARFX_CORE_ENABLE_WASM_EFFECTS=OFF

          # CMake writes these with CRLF on Windows, hence the tr.
          generator="$(tr -d '\r' < "$BUILD_DIR/CMakeCache.txt" | sed -n 's/^CMAKE_GENERATOR:INTERNAL=//p')"
          compiler="unknown"
          for f in "$BUILD_DIR"/CMakeFiles/*/CMakeCXXCompiler.cmake; do
            if [ -f "$f" ]; then
              id="$(tr -d '\r' < "$f" | sed -n 's/^set(CMAKE_CXX_COMPILER_ID "\([^"]*\)").*/\1/p')"
              version="$(tr -d '\r' < "$f" | sed -n 's/^set(CMAKE_CXX_COMPILER_VERSION "\([^"]*\)").*/\1/p')"
              compiler="$id $version"
            fi
          done
          {
            echo "generator: $generator"
            echo "compiler: $compiler"
            if [ "$ARCH" = x64 ]; then
              echo "simd level: $X64_SIMD"
            fi
          } | tee -a "$OUT_DIR/runner.txt"

          # Multi-config generators put each configuration's executables in a folder of its own.
          case "$generator" in
            "Visual Studio"* | Xcode | "Ninja Multi-Config") exe_dir="$BUILD_DIR/tests/Release" ;;
            *) exe_dir="$BUILD_DIR/tests" ;;
          esac
          exe_suffix=""
          if [ "$TARGET_OS" = windows ]; then
            exe_suffix=".exe"
          fi
          {
            echo "EXE_DIR=$exe_dir"
            echo "EXE_SUFFIX=$exe_suffix"
          } >> "$GITHUB_ENV"

      - name: Build
        id: build
        run: |
          set -euo pipefail
          cmake --build "$BUILD_DIR" --config Release --parallel "$JOBS" \
            --target FusedWaveNetTests FusedWaveNetBenchmark NAMPerformanceBenchmark

      # Correctness on the real kernel first: every test model within 100 dB of the NAM core,
      # bit-identical across host block patterns.
      - name: FusedWaveNetTests
        run: |
          set -euo pipefail
          "$EXE_DIR/FusedWaveNetTests${EXE_SUFFIX:-}" 2>&1 | tee "$OUT_DIR/FusedWaveNetTests.txt"
          if ! grep -q "Fused WaveNet kernel: $KERNEL" "$OUT_DIR/FusedWaveNetTests.txt"; then
            echo "::error::The $KERNEL kernel is not in this build, so nothing was tested on it"
            exit 1
          fi

      - name: FusedWaveNetBenchmark
        env:
          BLOCKS: ${{ inputs.blocks }}
          ROUNDS: ${{ inputs.rounds }}
          SECONDS_PER_ROUND: ${{ inputs.seconds }}
          MODELS: ${{ inputs.models }}
        run: |
          set -euo pipefail
          models=()
          if [ -n "$MODELS" ]; then
            # The defaults are named here too, since naming any model replaces them.
            amps=core/tests/testdata/assets/amps/Guitar
            models+=("$amps/TimR/JCM800 2203 1985/JCM800 Hi P6 B8 M4 T7 G6.nam"
                     "$amps/A2/Boosted-6505+-A2-Chugs-FullRig.nam")
            IFS=';' read -r -a extra <<< "$MODELS"
            for m in ${extra[@]+"${extra[@]}"}; do
              m="$(echo "$m" | sed 's/^ *//; s/ *$//')"
              if [ -n "$m" ]; then
                models+=("$m")
              fi
            done
          fi
          "$EXE_DIR/FusedWaveNetBenchmark${EXE_SUFFIX:-}" \
            --require-kernel "$KERNEL" \
            --block "$BLOCKS" --rounds "$ROUNDS" --seconds "$SECONDS_PER_ROUND" \
            --markdown "$OUT_DIR/FusedWaveNetBenchmark.md" \
            --json "$OUT_DIR/FusedWaveNetBenchmark.json" \
            ${models[@]+"${models[@]}"} 2>&1 | tee "$OUT_DIR/FusedWaveNetBenchmark.txt"

      # The same comparison through the NAM amp effect in a SignalGraphExecutor, as the app runs it,
      # still run when the steps above fail. Its output is long, so it goes to the artifact only.
      - name: NAMPerformanceBenchmark
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          "$EXE_DIR/NAMPerformanceBenchmark${EXE_SUFFIX:-}" > "$OUT_DIR/NAMPerformanceBenchmark.txt" 2>&1
          grep -E "Fused kernel:|SPEEDUP:|Block time improvement" "$OUT_DIR/NAMPerformanceBenchmark.txt" || true

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Fused benchmark: $PLATFORM_LABEL, $KERNEL ($RUNNER_LABEL)"
            echo
            echo '```'
            cat "$OUT_DIR/runner.txt" 2>/dev/null || true
            echo '```'
            echo
            if [ -f "$OUT_DIR/FusedWaveNetTests.txt" ]; then
              tests_txt="$(tr -d '\r' < "$OUT_DIR/FusedWaveNetTests.txt")"
              echo "**FusedWaveNetTests:** $(printf '%s\n' "$tests_txt" | grep -E 'FusedWaveNetTests (passed|FAILED|skipped)' | tail -1)"
              printf '%s\n' "$tests_txt" | grep -E "^FAIL:" | head -20 | sed 's/^/    /' || true
              echo
            fi
            cat "$OUT_DIR/FusedWaveNetBenchmark.md" 2>/dev/null || echo "FusedWaveNetBenchmark wrote no table: see the step log."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: fused-benchmark-${{ matrix.platform }}-${{ matrix.runner }}-${{ github.run_number }}
          path: ${{ env.OUT_DIR }}
          if-no-files-found: warn
