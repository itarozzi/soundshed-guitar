name: C++ structure

# Structural gate for the C++ tree. This is the counterpart of ui-checks.yml:
# it needs no C++ toolchain, so it runs in seconds and can gate every push
# rather than waiting on a platform build.
#
# It checks two things. No source file grows past the size budget, and no file
# already over it gets bigger: the controller was a single 15k-line translation
# unit before it was split into core/src/controller/, and this is what stops it
# growing back. And every dependency the build fetches is pinned to a commit or a
# release tag, so a clean build cannot change without a commit here. The UI/engine
# message protocol is checked here too, since a route can change on either side.
#
# The format job checks that our C++ is in the repo style (tools/format-cpp.mjs, which
# also holds the tool versions: another version formats differently).
#
# Not covered here: compiling. The platform build workflows do that.

on:
  push:
    paths:
      - "core/src/**"
      - "core/config/**"
      - "core/tests/**"
      - "juce/source/**"
      - "juce/tests/**"
      - "nanoq/src/**"
      - "nanoq/tests/**"
      - "juce/benchmarks/**"
      - "tools/nam-benchmark/**"
      - "tools/nano-fonts/**"
      - ".clang-format"
      - "juce/.clang-format"
      - "tools/uncrustify.cfg"
      - "tools/format-cpp.mjs"
      - "tools/check-cpp-file-sizes.js"
      - "tools/cpp-file-size-allowlist.json"
      - "core/CMakeLists.txt"
      - "core/cmake/**"
      - "tools/check-dependency-pins.mjs"
      - "core/protocol/**"
      - "tools/check-protocol.mjs"
      - ".github/workflows/cpp-structure.yml"
  pull_request:
    paths:
      - "core/src/**"
      - "core/config/**"
      - "core/tests/**"
      - "juce/source/**"
      - "juce/tests/**"
      - "nanoq/src/**"
      - "nanoq/tests/**"
      - "juce/benchmarks/**"
      - "tools/nam-benchmark/**"
      - "tools/nano-fonts/**"
      - ".clang-format"
      - "juce/.clang-format"
      - "tools/uncrustify.cfg"
      - "tools/format-cpp.mjs"
      - "tools/check-cpp-file-sizes.js"
      - "tools/cpp-file-size-allowlist.json"
      - "core/CMakeLists.txt"
      - "core/cmake/**"
      - "tools/check-dependency-pins.mjs"
      - "core/protocol/**"
      - "tools/check-protocol.mjs"
      - ".github/workflows/cpp-structure.yml"
  workflow_dispatch:

concurrency:
  group: cpp-structure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  file-sizes:
    name: file size budget
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: File size budget
        run: node tools/check-cpp-file-sizes.js

      - name: Dependency pins
        run: node tools/check-dependency-pins.mjs

      - name: UI/engine protocol
        run: node tools/check-protocol.mjs

  format:
    name: C++ format
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Tool versions
        id: pins
        run: |
          echo "clang_format=$(node tools/format-cpp.mjs --pin clang-format)" >> "$GITHUB_OUTPUT"
          echo "uncrustify=$(node tools/format-cpp.mjs --pin uncrustify)" >> "$GITHUB_OUTPUT"

      # No distribution packages the pinned uncrustify, so it is built at its release tag, once.
      - uses: actions/cache@v6
        id: uncrustify
        with:
          path: ~/uncrustify
          key: uncrustify-${{ steps.pins.outputs.uncrustify }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build uncrustify
        if: steps.uncrustify.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "uncrustify-${{ steps.pins.outputs.uncrustify }}" https://github.com/uncrustify/uncrustify.git "$RUNNER_TEMP/uncrustify-src"
          cmake -S "$RUNNER_TEMP/uncrustify-src" -B "$RUNNER_TEMP/uncrustify-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/uncrustify-build" -j "$(nproc)"
          mkdir -p ~/uncrustify
          cp "$RUNNER_TEMP/uncrustify-build/uncrustify" ~/uncrustify/

      - name: Install the tools
        run: |
          echo "$HOME/uncrustify" >> "$GITHUB_PATH"
          pipx install "clang-format==${{ steps.pins.outputs.clang_format }}"

      - name: Format check
        run: node tools/format-cpp.mjs --check
