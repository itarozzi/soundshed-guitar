<div id="blend-editor-modal" class="modal" style="display: none;">
      <div class="modal-content blend-editor-modal" role="dialog" aria-modal="true" aria-labelledby="blend-editor-title">
        <div class="modal-header">
          <h3 id="blend-editor-title">Edit Blend</h3>
          <button class="modal-close" id="blend-editor-modal-close" type="button" aria-label="Close">×</button>
        </div>
        <div class="modal-body blend-editor-body">
          <div class="blend-editor-head">
            <input type="text" id="blend-editor-name-input" class="blend-editor-name" placeholder="Blend name" aria-label="Blend name" />
            <div class="blend-segmented" role="group" aria-label="Blend mode">
              <button type="button" data-blend-mode="interpolate" title="Crossfade between the two nearest models">Interpolate</button>
              <button type="button" data-blend-mode="snap" title="Play the nearest model">Snap</button>
            </div>
            <div class="blend-segmented" role="group" aria-label="Place models by">
              <button type="button" data-blend-axis="params" title="Place each model at the settings it was captured at; the node gets a knob for each">Parameters</button>
              <button type="button" data-blend-axis="sweep" title="Place the models in list order; the node gets one Blend knob that sweeps through them">Sweep</button>
            </div>
          </div>
          <div id="blend-editor-table" class="blend-editor-table-wrap"></div>
          <ul id="blend-editor-warnings" class="blend-editor-warnings"></ul>
          <div class="blend-editor-tools">
            <button class="btn btn-secondary" id="blend-add-models-btn" type="button">+ Add Models</button>
            <button class="btn btn-secondary" id="blend-fill-names-btn" type="button" title="Fill empty values from the models' names, such as G5 for Gain 5">Fill from Names</button>
            <button class="btn btn-secondary" id="blend-match-levels-btn" type="button" title="Set each model's level trim from the loudness in its file">Match Levels</button>
          </div>
          <div class="blend-editor-try">
            <span class="blend-editor-try-label">Try</span>
            <div id="blend-test-controls" class="blend-test-controls"></div>
            <div id="blend-match-line" class="blend-editor-playing"></div>
          </div>
          <p id="blend-test-note" class="blend-test-note"></p>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" id="blend-editor-cancel" type="button">Cancel</button>
          <button class="btn btn-primary" id="blend-editor-save" type="button">Save</button>
        </div>
      </div>
    </div>
